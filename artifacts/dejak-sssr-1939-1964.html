    { front: "Hladomor a Velký teror – počty?", back: "Hladomor (Ukrajina 1932–33): asi 3 mil.; Velký teror 1937–38: asi 700 000 popravených." },
    { front: "Co byl Hladový plán?", back: "Nacistický plán nechat v zimě 1941/42 vyhladovět asi 30 mil. lidí na východě; realizován na sovětských zajatcích (3 mil.) a Leningradu (1 mil.)." },
    { front: "Operace Barbarossa – datum a rozsah?", back: "22. 6. 1941; přes 3 mil. vojáků, fronta 3 200 km, 3 směry (Leningrad, Moskva, Kyjev)." },
    { front: "Proč byl SSSR v roce 1941 zaskočen?", back: "Stalin ignoroval zpravodajce, žádné obranné plány, velení zdecimováno čistkami." },
    { front: "Blokáda Leningradu?", back: "8. 9. 1941 – 27. 1. 1944, 900 dní, přes 1 mil. civilistů zemřelo hladem." },
    { front: "Stalingrad – výsledek?", back: "VIII 1942 – 2. 2. 1943; Paulus kapituloval, 300 000 † Němců a spojenců, 90 000 zajatých (vrátilo se 6 000). Zlom války." },
    { front: "Kursk?", back: "Červenec 1943 – největší tanková bitva; poslední německá ofenziva, iniciativa přešla na RA." },
    { front: "Lend-Lease – co a kolik pro SSSR?", back: "USA 11. 3. 1941; SSSR 20 %: 15 000 letadel, 350 000 nákladních aut, ocel, hliník, 3,8 mil. t potravin." },
    { front: "Rozkaz č. 227?", back: "„Ani krok zpět“ (1942): kdo se vzdá = zrádce, rodina trestána, dezertéři zastřeleni na místě." },
    { front: "Kdo byli vlasovci?", back: "Ruská osvobozenecká armáda gen. Vlasova (zajat 1942) na straně Německa." },
    { front: "Kdo byl Stepan Bandera?", back: "1909–1959, vůdce OUN (Banderova frakce); 1941 vyhlásil Ukrajinu → KT; zavražděn KGB v Mnichově." },
    { front: "Co byla UPA?", back: "Ukrajinská povstalecká armáda (1942), křídlo OUN-B; boj za nezávislost proti Němcům, Sovětům i Polákům; Volyň." },
    { front: "Volyňský masakr?", back: "1943–44, UPA vyvraždila desítky tisíc polských civilistů; Polsko 2016 = genocida." },
    { front: "Co je „weaponizace dějin“?", back: "Zneužití historie jako zbraně pro současné politické cíle (Řepa) – např. Putinova „denacifikace“." },
    { front: "Pakt tří?", back: "27. 9. 1940 Německo, Itálie, Japonsko; přidaly se Maďarsko, Rumunsko, Slovensko. SSSR nevstoupil." },
    { front: "Kam chtěl Hitler směrovat sovětskou expanzi?", back: "Na jih – Írán, Indie – aby oslabil Británii." },
    { front: "Dohoda Sikorski–Majskij?", back: "30. 7. 1941 – spojenectví polské exilové vlády a SSSR, hranice ponechány otevřené." },
    { front: "Co je Kominforma?", back: "Informační byro komunistických stran (1947), nástroj Moskvy – náhrada Kominterny." },
    { front: "Pozitiva Chruščova (aspoň 4)?", back: "Amnestie 2 mil., poprava Beriji, odchod z Rakouska, smíření s Titem, odpuštění dluhů Maďarsku, Jáchymov ČSR, Sputnik, Gagarin, XX. sjezd." },
    { front: "Negativa Chruščova (aspoň 3)?", back: "Varšavská smlouva 1955, potlačení Maďarska 1956, jaderné hrozby v Suezu, Berlínská zeď, Karibská krize, Novočerkassk." },
    { front: "XX. sjezd KSSS?", back: "Únor 1956; tajný projev 25. 2. – odhalení kultu Stalinovy osobnosti, Leninův dopis z 1922." },
    { front: "Maďarsko 1956 – klíčová data?", back: "23. 10. demonstrace → ÁVH střílí → povstání; 24. 10. sovětské tanky; 25. 10. Nagy; 28. 10. konec bojů; neutralita + vystoupení z VS; 1. 11. Moskva rozhodla o intervenci, 4. 11. útok, boje do 10. 11." },
    { front: "Maďarsko 1956 – represe (čísla z prezentace)?", back: "4 000 †, 229 poprav (Nagy 1958), 22 000 vězňů (amnestie 1963), 200 000 v exilu." },
    { front: "Postupimská konference?", back: "17. 7. – 2. 8. 1945: Truman, Stalin, Attlee; 4 okupační zóny, 4D, hranice Odra–Nisa, odsun Němců." },
    { front: "Co jsou 4D?", back: "Demilitarizace, demokratizace, denacifikace, dekartelizace Německa." },
    { front: "Fulton 1946?", back: "Churchill: železná opona od Štětína na Baltu po Terst na Jadranu." },
    { front: "Trumanova doktrína?", back: "1947 – pomoc státům ohroženým komunismem: Řecko 250 mil. $, Turecko 150 mil. $." },
    { front: "1. berlínská krize?", back: "Po měnové reformě SSSR 24. 6. 1948 zablokoval Západní Berlín; letecký most (2,5 mil. t, 70 † letců); konec 12. 5. 1949 → SRN a NDR." },
    { front: "2. berlínská krize?", back: "1949–61 uteklo z NDR skoro 3 mil. lidí → 13. 8. 1961 Berlínská zeď (164 km)." },
    { front: "Karibská krize – jak skončila?", back: "28. 10. 1962: SSSR stáhl rakety × USA zaručily nenapadení Kuby + tajně stáhly rakety Jupiter z Turecka; horká linka." },
    { front: "Gulášový socialismus?", back: "Kádárův kurz od 60. let: „Kdo není proti nám, je s námi“, NEM 1968, relativní blahobyt × dluhy a vláda jedné strany." },
    { front: "Varšavské povstání?", back: "1. 8. – 3. 10. 1944, Armia Krajowa; 15 000 vojáků + 200 000 civilistů †, Rudá armáda nečinně přihlížela." },
    { front: "Irena Sendlerowa?", back: "Żegota, zachránila asi 2 500 židovských dětí; Spravedlivá mezi národy 1965." },
    { front: "Józef Czapski?", back: "Malíř z Prahy, přežil sovětské zajetí (přímluva německé ambasády), pátral po Katyni, kniha Na nelidské zemi." },
    { front: "Co se stalo manželkám polských důstojníků?", back: "13. 4. 1940 NKVD v jedné noci zatkla rodiny (adresy z dopisů) a deportovala je do Kazachstánu." },
    { front: "Smolenská katastrofa?", back: "10. 4. 2010, cestou na pietu v Katyni, 96 mrtvých včetně prezidenta L. Kaczyńského." }
  ],
  quizQuestions: [
    { question: "Kdy byl podepsán pakt Ribbentrop–Molotov?", type: "single", options: ["23. 8. 1939", "1. 9. 1939", "17. 9. 1939", "28. 9. 1939"], correct: [0], explanation: "Pakt podepsali ministři zahraničí 23. 8. 1939 v Moskvě; 1. 9. následoval útok Německa, 17. 9. SSSR." },
    { question: "Co obsahoval tajný dodatek paktu Ribbentrop–Molotov?", type: "single", options: ["Rozdělení sfér vlivu – Polsko a Pobaltí", "Společný útok na Francii", "Dodávky zbraní SSSR do Německa", "Vzájemnou vojenskou pomoc proti Británii"], correct: [0], explanation: "Veřejně šlo o neútočení, tajný dodatek dělil východní Evropu na sféry vlivu (Polsko, Pobaltí, Finsko, Besarábie)." },
    { question: "Která území získal SSSR v letech 1939–1940? (vyber všechna správná)", type: "multi", options: ["Západní Ukrajinu a Bělorusko", "Pobaltské státy", "Besarábii", "Celé Finsko", "Slovensko"], correct: [0, 1, 2], explanation: "Finsko se ubránilo – SSSR získal jen Karelskou šíji. Slovensko bylo spojencem Německa." },
    { question: "Jaký byl hlavní výsledek zimní války pro SSSR?", type: "single", options: ["Minimální zisk (Karelská šíje), obrovské ztráty a vyloučení ze SN", "Anexe celého Finska", "Rychlé vítězství během 2 týdnů", "Spojenectví s Finskem proti Německu"], correct: [0], explanation: "Přes trojnásobnou převahu padlo 126 875 sovětských vojáků; SSSR byl vyloučen ze Společnosti národů a Finsko se přiklonilo k Německu." },
    { question: "Kolik lidí zemřelo podle Snydera v „krvavých zemích“ 1933–45?", type: "single", options: ["asi 14 milionů", "asi 6 milionů", "asi 27 milionů", "asi 50 milionů"], correct: [0], explanation: "14 milionů civilních obětí cílené politiky (ne padlých vojáků), třetina na sovětský účet." },
    { question: "Které kategorie obětí patří do Snyderových 14 milionů? (vyber všechny)", type: "multi", options: ["Oběti hladomoru na Ukrajině", "Oběti Velkého teroru 1937–38", "Vyhladovělí sovětští zajatci", "Padlí vojáci Rudé armády u Stalingradu", "Židé zavraždění v holokaustu"], correct: [0, 1, 2, 4], explanation: "Snyder počítá jen oběti záměrné vražedné politiky – padlí vojáci v boji do čísla nepatří." },
    { question: "Kolik lidí bylo popraveno při Velkém teroru 1937–38?", type: "single", options: ["asi 700 000", "asi 70 000", "asi 3 miliony", "asi 7 milionů"], correct: [0], explanation: "Asi 700 000 (Snyder: skoro sedm set tisíc), nepoměrně mnoho rolníků a sovětských Poláků." },
    { question: "Co byl nacistický „Hladový plán“?", type: "single", options: ["Plán nechat vyhladovět asi 30 mil. lidí na okupovaném východě", "Přídělový systém v Německu", "Blokáda Británie ponorkami", "Sovětská rekvizice obilí na Ukrajině"], correct: [0], explanation: "Uskutečnil se jen částečně – na sovětských zajatcích (3 mil.) a v obleženém Leningradu (1 mil.)." },
    { question: "Proč byl SSSR útokem 22. 6. 1941 zaskočen? (vyber všechny důvody)", type: "multi", options: ["Stalin ignoroval varování zpravodajců", "Velení RA bylo zdecimované čistkami", "SSSR neměl plány na obranu", "SSSR byl ve válce s Japonskem"], correct: [0, 1, 2], explanation: "Naopak – SSSR měl jistotu, že Japonsko na Dálném východě nezaútočí, a mohl přesunout sibiřské divize." },
    { question: "Kolik dní trvala blokáda Leningradu?", type: "single", options: ["asi 900", "asi 200", "asi 90", "asi 1 500"], correct: [0], explanation: "8. 9. 1941 – 27. 1. 1944, 900 dní; přes milion civilistů zemřelo hladem." },
    { question: "Kdo kapituloval u Stalingradu?", type: "single", options: ["Friedrich Paulus", "Erwin Rommel", "Andrej Vlasov", "Heinz Guderian"], correct: [0], explanation: "Paulus byl v kotli povýšen na maršála – žádný německý maršál se dosud nevzdal. Kapitulace 2. 2. 1943." },
    { question: "Která bitva je považována za největší tankovou bitvu dějin?", type: "single", options: ["Kursk (1943)", "Stalingrad (1942–43)", "Moskva (1941)", "El Alamein (1942)"], correct: [0], explanation: "Kursk, červenec 1943 – poslední velká německá ofenziva na východě." },
    { question: "Jaký podíl dodávek Lend-Lease připadl SSSR?", type: "single", options: ["asi 20 %", "asi 60 %", "asi 5 %", "asi 90 %"], correct: [0], explanation: "UK asi 60 %, SSSR asi 20 % (15 000 letadel, 350 000 nákladních aut…). SSSR dluh nesplatil." },
    { question: "Co stanovil Stalinův rozkaz č. 227?", type: "single", options: ["Kdo se vzdá, je zrádce; jeho rodina bude potrestána", "Evakuaci průmyslu za Ural", "Amnestii pro vězně gulagu", "Zahájení operace Bagration"], correct: [0], explanation: "„Ani krok zpět“ – dezertéři zastřeleni na místě, rodiny zbaveny podpory; za dezerci zastřeleno asi 160 000 vojáků." },
    { question: "Kdo byl Andrej Vlasov?", type: "single", options: ["Sovětský generál, který v zajetí vytvořil ROA na straně Německa", "Šéf NKVD", "Velitel obrany Leningradu", "Vůdce UPA"], correct: [0], explanation: "Zajat 1942, od 1943 Ruská osvobozenecká armáda (vlasovci)." },
    { question: "Kdo byl Stepan Bandera?", type: "single", options: ["Vůdce radikální frakce OUN", "Velitel Armie Krajowe", "Šéf Ukrajinského institutu paměti", "Sovětský partyzánský velitel"], correct: [0], explanation: "1909–1959; po vyhlášení samostatné Ukrajiny (30. 6. 1941) ho Němci poslali do KT, v roce 1959 ho zavraždil agent KGB." },
    { question: "Proti komu bojovala UPA? (vyber všechny)", type: "multi", options: ["Proti Němcům", "Proti Sovětům", "Proti Polákům (etnické čistky)", "Proti Britům"], correct: [0, 1, 2], explanation: "Boj „proti všem“: 1943–44 Němci, od 1944 Sověti (do 50. let), zároveň Volyňský masakr Poláků." },
    { question: "Kolik obětí přičítá UPA historik John-Paul Himka?", type: "single", options: ["60–100 tisíc, převážně Poláků", "asi 1 milion Rusů", "asi 5 000", "asi 500 tisíc Židů"], correct: [0], explanation: "Himka: 60–100 tisíc lidí, převážně Poláků." },
    { question: "Jakou volební podporu měly nacionalistické strany hlásící se k Banderovi?", type: "single", options: ["Malou – Svoboda maximálně asi 10 % (2012), v roce 2019 asi 2 %", "Vládly Ukrajině od roku 2014", "Pravidelně přes 30 %", "Nikdy nekandidovaly"], correct: [0], explanation: "Podle Řepy všechny tyto strany opakovaně ve volbách propadly – rovnice Ukrajinec = banderovec je nesmysl." },
    { question: "Které skupiny označovala stalinská propaganda za „fašisty“? (vyber všechny)", type: "multi", options: ["Banderovci", "Polská Armia Krajowa", "Pobaltští lesní bratři", "Rumunští monarchističtí povstalci"], correct: [0, 1, 2, 3], explanation: "Kdo byl proti Moskvě, byl „fašista“ – i AK, která bojovala proti nacistům." },
    { question: "Co je podle Řepy „weaponizace dějin“?", type: "single", options: ["Zneužití historie jako zbraně pro současnou politiku", "Studium vojenské historie", "Vývoj zbraní během WWII", "Ničení historických památek"], correct: [0], explanation: "Weapon = zbraň. Příklad: Putinova „denacifikace“ Ukrajiny (2022)." },
    { question: "Proč causa banderovců komplikuje polsko-ukrajinské vztahy? (vyber všechny)", type: "multi", options: ["Volyňský masakr Poláků 1943–44", "Oslavy Bandery a UPA na Ukrajině", "Spory o exhumace obětí", "Spor o členství Ukrajiny v Paktu tří"], correct: [0, 1, 2], explanation: "Polsko uznalo Volyň za genocidu (2016), Ukrajinci připomínají Akci Visla; exhumace byly roky blokované." },
    { question: "Kdy byl podepsán Pakt tří?", type: "single", options: ["27. 9. 1940", "23. 8. 1939", "22. 6. 1941", "11. 3. 1941"], correct: [0], explanation: "Německo, Itálie, Japonsko v Berlíně; v listopadu se připojily Maďarsko, Rumunsko a Slovensko." },
    { question: "Kam chtěl Hitler podle Rychlíka nasměrovat sovětskou expanzi?", type: "single", options: ["Na jih – do Íránu a Indie", "Na Balkán", "Do Skandinávie", "Do střední Evropy"], correct: [0], explanation: "Cíl: oslabit Britské impérium. SSSR ale chtěl zůstat evropskou mocností a Balkánu se nevzdal." },
    { question: "Proč se Finsko a Rumunsko připojily k útoku na SSSR?", type: "single", options: ["Chtěly zpět území ztracená roku 1940", "Byly k tomu donuceny okupací", "Chtěly získat Polsko", "Kvůli Paktu tří, jehož byly obě členy"], correct: [0], explanation: "Finsko (Karelská šíje) a Rumunsko (Besarábie, sev. Bukovina). Finsko navíc členem Paktu tří formálně nebylo." },
    { question: "Co následovalo po odhalení hrobů v Katyni v dubnu 1943?", type: "single", options: ["SSSR přerušil styky s polskou exilovou vládou", "SSSR přiznal vinu", "Spojenci vyhlásili SSSR válku", "Polská vláda se přestěhovala do Moskvy"], correct: [0], explanation: "Poláci požádali o vyšetření Červený kříž; SSSR přerušil styky a v roce 1944 ustavil vlastní prosovětskou vládu. Vinu přiznal až 1990." },
    { question: "Které kroky patří k zahraniční politice SSSR v letech 1945–53? (vyber všechny)", type: "multi", options: ["Založení Kominformy", "Vytváření nárazníkového pásma satelitů", "Tajné plánování invaze proti Jugoslávii", "Odchod Rudé armády z Rakouska"], correct: [0, 1, 2], explanation: "Odchod z Rakouska (1955) je až Chruščovova éra." },
    { question: "Kdo byl obětí nové vlny represí po roce 1945?", type: "multi", options: ["Navrátilí zajatí vojáci", "Židé", "„Úchylkáři“", "Bývalí carští generálové v exilu v USA"], correct: [0, 1, 2], explanation: "Zajatci jako „zrádci“ do gulagu, antisemitská kampaň proti „kosmopolitismu“ a lékařské spiknutí." },
    { question: "Co patří mezi POZITIVA Chruščovovy vlády? (vyber všechny)", type: "multi", options: ["Amnestie asi 2 mil. vězňů", "Odchod RA z Rakouska", "Odhalení kultu osobnosti", "Založení Varšavské smlouvy", "Sputnik a Gagarin"], correct: [0, 1, 2, 4], explanation: "Varšavská smlouva (1955) je v prezentaci mezi negativy." },
    { question: "Kdy přednesl Chruščov tajný projev o kultu osobnosti?", type: "single", options: ["25. 2. 1956 na XX. sjezdu KSSS", "5. 3. 1953 po Stalinově smrti", "4. 11. 1956", "12. 4. 1961"], correct: [0], explanation: "Součástí bylo zveřejnění Leninova dopisu z roku 1922 varujícího před Stalinem." },
    { question: "Co vyhlásil Imre Nagy 1. 11. 1956?", type: "single", options: ["Neutralitu a vystoupení z Varšavské smlouvy", "Vstup do NATO", "Kapitulaci povstalců", "Obnovu monarchie"], correct: [0], explanation: "Na to SSSR 4. 11. odpověděl invazí; Nagy byl v roce 1958 popraven." },
    { question: "Proč Západ v Maďarsku 1956 nezasáhl?", type: "single", options: ["Souběžná Suezská krize a strach z války se SSSR", "Maďarsko bylo členem NATO", "Povstání trvalo jen jeden den", "OSN zakázala zásah"], correct: [0], explanation: "Británie a Francie byly zaměstnány v Egyptě, USA nechtěly riskovat jadernou válku." },
    { question: "Kdo byl vystřídán na postu prvního tajemníka maďarských komunistů v létě 1956 a kým?", type: "single", options: ["Rákosi → stalinista Ernő Gerő", "Rákosi → Imre Nagy", "Nagy → János Kádár", "Gerő → Rákosi"], correct: [0], explanation: "Moskva po XX. sjezdu a Poznani odvolala Rákosiho, ale nahradila ho dalším stalinistou Gerőem, který 23. 10. nazval demonstranty lůzou a povolal sovětské tanky." },
    { question: "Kolik obětí si podle prezentace vyžádalo maďarské povstání a represe?", type: "single", options: ["4 000 † + 229 poprav", "asi 400 †", "asi 40 000 † + 2 290 poprav", "nikdo nezemřel"], correct: [0], explanation: "Navíc 22 000 vězňů (amnestie 1963) a 200 000 lidí v exilu." },
    { question: "Co bylo dohodnuto v Postupimi 1945? (vyber všechna správná)", type: "multi", options: ["Rozdělení Německa a Rakouska na 4 okupační zóny", "4D – demilitarizace, demokratizace, denacifikace, dekartelizace", "Hranice Odra–Nisa", "Vznik NATO"], correct: [0, 1, 2], explanation: "NATO vzniklo až 4. 4. 1949. V Postupimi se dohodl i odsun Němců a uznání územních zisků SSSR." },
    { question: "Co bylo bezprostředním spouštěčem blokády Berlína (24. 6. 1948)?", type: "single", options: ["Měnová reforma v západních zónách a rozhodnutí vytvořit západoněmecký stát", "Vznik NATO", "Stavba Berlínské zdi", "Smrt Stalina"], correct: [0], explanation: "SSSR odpověděl uzavřením přístupových cest; Západ zásoboval město leteckým mostem až do 12. 5. 1949." },
    { question: "Kdy byla postavena Berlínská zeď?", type: "single", options: ["V noci z 12. na 13. 8. 1961", "24. 6. 1948", "7. 10. 1949", "28. 10. 1962"], correct: [0], explanation: "2. berlínská krize – z NDR do té doby uteklo skoro 3 mil. lidí. Nezaměňuj s blokádou Berlína 1948–49!" },
